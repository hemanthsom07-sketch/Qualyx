# Alembic configuration for the Qualyx backend.
#
# Run Alembic from the backend/ directory, e.g.:
#   alembic upgrade head
# or from anywhere with: alembic -c backend/alembic.ini upgrade head
#
# The database URL is NOT stored here. alembic/env.py reads it from
# app.config.settings.database_url (DATABASE_URL / backend/.env), exactly like
# the application does. Setting `sqlalchemy.url` below overrides that (useful
# for one-off runs and tests).

[alembic]
script_location = %(here)s/alembic

sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
