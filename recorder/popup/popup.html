<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Qualyx Recorder</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        padding: 16px;
        background: #0f172a;
        color: #f1f5f9;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      .row span:last-child {
        color: #f1f5f9;
        font-weight: 600;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 12px;
      }
      button {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f1f5f9;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Qualyx Recorder</h1>
    <div class="row"><span>Status</span><span id="status">idle</span></div>
    <div class="row"><span>Events</span><span id="count">0</span></div>
    <div class="buttons">
      <button id="start-btn">Start Recording</button>
      <button id="stop-btn" disabled>Stop Recording</button>
      <button id="clear-btn">Clear Recording</button>
    </div>
    <script type="module" src="../dist/popup/popup.js"></script>
  </body>
</html>
